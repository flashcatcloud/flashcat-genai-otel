[project]
name = "flashcat-instrumentation-mcp"
version = "0.1.0"
description = "OpenTelemetry instrumentation for MCP Python SDK 1.x tool calls (client and server), following the OTel MCP semantic conventions"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Flashcat" }]
dependencies = [
    "opentelemetry-api~=1.43",
    "opentelemetry-instrumentation>=0.64b0,<1",
    "opentelemetry-util-genai~=1.3b0",
    "wrapt>=1.17,<3",
]

[project.optional-dependencies]
instruments = ["mcp>=1.0,<2"]

[project.urls]
Homepage = "https://flashcat.cloud/"
Source = "https://github.com/flashcatcloud/flashcat-genai-otel"

[project.entry-points.opentelemetry_instrumentor]
mcp = "flashcat.instrumentation.mcp:MCPInstrumentor"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flashcat"]

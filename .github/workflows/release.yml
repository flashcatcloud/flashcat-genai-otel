name: release

# On a v<version> tag, build the artifacts for all four languages and create the GitHub Release.
# See RELEASING.md for how to tag a release and how to install each language from it.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        run: scripts/build-release.sh "${GITHUB_REF_NAME#v}" dist
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes "Installation for all four languages: see [RELEASING.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/RELEASING.md#install-from-github-releases). Go module tags: go/${GITHUB_REF_NAME}, go/instrumentation/openai/${GITHUB_REF_NAME}, go/instrumentation/eino/${GITHUB_REF_NAME}, go/instrumentation/mcp/${GITHUB_REF_NAME}."
